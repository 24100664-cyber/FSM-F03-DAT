name: FSM F03 - GDSII

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gdsii:
    name: Physical Design and GDSII
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Volare
        run: |
          python3 -m pip install --user --upgrade volare
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download and enable Sky130 PDK
        run: |
          mkdir -p "$HOME/.volare"
          volare enable \
            --pdk sky130 \
            --pdk-root "$HOME/.volare" \
            0fe599b2afb6708d281543108caf8310912f54af

      - name: Check Sky130 PDK
        run: |
          test -d "$HOME/.volare/sky130A"
          test -d "$HOME/.volare/sky130A/libs.ref/sky130_fd_sc_hd"

      - name: Run LibreLane physical design
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -v "$HOME/.volare:/pdk:ro" \
            -w /work \
            -e PDK_ROOT=/pdk \
            ghcr.io/librelane/librelane:3.0.16 \
            librelane \
            --manual-pdk \
            --pdk-root /pdk \
            --pdk sky130A \
            --scl sky130_fd_sc_hd \
            04_IMPLEMENTATION/scripts/config_librelane.json \
            --run-tag f03-gdsii-ci \
            --overwrite

      - name: Collect GDSII and signoff results
        if: always()
        run: |
          set -u

          RUN="04_IMPLEMENTATION/scripts/runs/f03-gdsii-ci"
          OUT="06_GDSII/ci"

          mkdir -p "$OUT/gds" "$OUT/reports" "$OUT/metrics"

          if [ -d "$RUN" ]; then
            find "$RUN" -type f -name "*.gds" \
              -exec cp --parents {} "$OUT/gds" \;

            find "$RUN" -type f \
              \( -name "*.rpt" -o -name "metrics.csv" -o -name "metrics.json" \) \
              -print > "$OUT/files.txt"

            while IFS= read -r file; do
              [ -f "$file" ] || continue

              case "$file" in
                *.rpt)
                  cp --parents "$file" "$OUT/reports"
                  ;;
                */metrics.csv|*/metrics.json)
                  cp --parents "$file" "$OUT/metrics"
                  ;;
              esac
            done < "$OUT/files.txt"
          else
            echo "LibreLane run directory not found: $RUN" \
              > "$OUT/collection-error.txt"
          fi

      - name: Upload GDSII and signoff results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdsii-signoff
          if-no-files-found: warn
          path: |
            06_GDSII/ci/
